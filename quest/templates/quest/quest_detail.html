{% extends 'quest/base.html' %}
{% load static %}

{% block content %}
<div class="container my-4 d-flex justify-content-center align-items-center h-50">
    <div class="card text-center mb-3 h-100">
        <div class="card-header">
            <h2 class="card-title">{{ quest.title }}</h2>
        </div>
        <div class="card-body d-flex flex-column justify-content-center align-items-center gap-3">
            <p class="card-text">{{ quest.description }}</p>
            <p class="card-text">Стоимость: {{quest.cost}}</p>
            <p class="card-text">Продолжительность: {{quest.duration}}</p>
            <div class="d-flex justify-content-center align-items-center gap-3">
                {% for time in times %}
                <button type="button" class="btn btn-sm btn-outline-secondary">Бронь на {{ time }}</button>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
