<!DOCTYPE html>
{% extends 'quest/base.html' %}
{% load static %}
{% block content %}
<div class="album py-5">
    <div class="container">
        <h1 style="margin-bottom: 30px;">Каталог</h1>
        <div class="m-5">
            <form class="d-flex justify-content-center align-items-center gap-2" method="GET"
                  action="{% url 'quest:catalog' %}">
                <label for="name">Поиск по названию: </label>
                <input type="text" id="name" name="quest_name" value="{{ quest_query|default:'' }}">
                <button type="submit">Поиск</button>
            </form>
        </div>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
            {% if quests %}
            {% for quest in quests %}
            <div class="col mb-4">
                <div class="card h-100 shadow-sm">
                    <img src="{{ quest.image.url }}" class="card-img-top" alt="Изображение"
                         style="width: 100%; height: 225px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h4 class="card-title">{{ quest.title }}</h4>
                        <p class="card-text flex-grow-1">{{ quest.description }}</p>
                        <div class="mt-auto">
                            <a href="{% url 'quest:quest_detail' quest.pk %}"
                               class="btn text-white w-100" style="background-color: #4682B4;"
                               role="button">Подробнее</a>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
            {% else %}
            <p>Ничего не найдено.</p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
